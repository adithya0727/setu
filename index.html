<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Setu</title>
<meta name="description" content="A private ledger for money sent home.">

<!-- The access token lives in localStorage, so the thing worth defending against
     is script injection: anything that could read it must also be unable to send
     it anywhere. 'default-src none' means every kind of load has to be named
     below, and connect-src names the only host this app may ever talk to.
     Note frame-ancestors is ignored when CSP arrives in a meta tag rather than a
     header, and GitHub Pages cannot set headers — see README. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self';
  font-src 'self';
  connect-src 'self' https://api.github.com;
  manifest-src 'self';
  worker-src 'self';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<!-- iOS home-screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setu">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ───────────────────────── Setup / lock screen ───────────────────────── -->
<div id="setup" class="setup" hidden>
  <div class="setup-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M8 31c0-9 7.2-16 16-16s16 7 16 16" stroke="url(#bg1)" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="24" cy="31" r="3.4" fill="url(#bg1)"/>
          <defs><linearGradient id="bg1" x1="8" y1="15" x2="40" y2="31" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#818CF8"/>
          </linearGradient></defs>
        </svg>
      </div>
      <h1>Setu</h1>
      <p class="brand-sub">A private ledger between two people.</p>
    </div>

    <form id="setup-form" class="setup-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Data repository</span>
        <input type="text" id="in-repo" placeholder="username/setu-data" spellcheck="false"
               autocapitalize="none" autocorrect="off" required>
        <span class="field-hint">The private repo holding <code>ledger.json</code>.</span>
      </label>

      <label class="field">
        <span class="field-label">Access token</span>
        <input type="password" id="in-token" placeholder="github_pat_…" spellcheck="false"
               autocapitalize="none" autocorrect="off" required>
        <span class="field-hint">Fine-grained token with <b>Contents: Read and write</b>. Stored on this device only.</span>
      </label>

      <div class="field">
        <span class="field-label">I am</span>
        <div class="seg" id="in-who" role="radiogroup" aria-label="Who is using this device"></div>
      </div>

      <p class="setup-error" id="setup-error" hidden></p>
      <button type="submit" class="btn-primary" id="setup-go">Connect</button>
    </form>

    <p class="setup-foot">Nothing is stored on this page. Without a token there is nothing to see.</p>
  </div>
</div>

<!-- ───────────────────────── App shell ───────────────────────── -->
<div id="app" class="app" hidden>

  <div class="status-veil" aria-hidden="true"></div>
  <div class="refresh-hint" id="refresh-hint"><span class="spinner"></span></div>

  <main id="screen" class="screen"></main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tab" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="activity" aria-label="Activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
      <span>Activity</span>
    </button>
    <button class="tab tab-add" data-tab="add" aria-label="Add entry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="purposes" aria-label="Purposes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v8H4v-8"/><path d="M2 8h20v4H2z"/><path d="M12 20V8"/><path d="M12 8S10.5 4 8.2 4a2.2 2.2 0 0 0 0 4.4H12Z"/><path d="M12 8s1.5-4 3.8-4a2.2 2.2 0 0 1 0 4.4H12Z"/></svg>
      <span>Purposes</span>
    </button>
    <button class="tab" data-tab="insights" aria-label="Insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span>Insights</span>
    </button>
  </nav>
</div>

<!-- ───────────────────────── Sheet host ───────────────────────── -->
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-grab" id="sheet-grab"><span></span></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./js/ui.js"></script>
</body>
</html>
